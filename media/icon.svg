<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#4a1f62"/>
      <stop offset="0.6" stop-color="#26103c"/>
      <stop offset="1" stop-color="#10061c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6fae" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff6fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6fae" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6fae" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2160"/>
      <stop offset="1" stop-color="#1f0f33"/>
    </linearGradient>
    <radialGradient id="lit" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffc2dc"/>
      <stop offset="0.5" stop-color="#ff6fae"/>
      <stop offset="1" stop-color="#b8296b"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="34" cy="128" r="1.6"/><circle cx="372" cy="292" r="1.8"/><circle cx="148" cy="24" r="1.4"/>
    <circle cx="258" cy="380" r="1.4"/><circle cx="20" cy="270" r="1.8"/><circle cx="380" cy="150" r="1.4"/>
  </g>

  <!-- the wheel -->
  <circle cx="200" cy="206" r="142" fill="none" stroke="#ff6fae" stroke-width="2.5" stroke-dasharray="4 10" stroke-linecap="round" opacity="0.4"/>

  <!-- glow behind the waving hero -->
  <circle cx="200" cy="220" r="112" fill="url(#aura)"/>
  <ellipse cx="200" cy="274" rx="84" ry="15" fill="url(#pool)"/>

  <!-- unlit slots -->
  <g fill="url(#slot)" stroke="#7a56a3" stroke-width="3">
    <circle cx="200" cy="64" r="27"/>
    <circle cx="342" cy="206" r="27"/>
    <circle cx="300.4" cy="306.4" r="27"/>
    <circle cx="200" cy="348" r="27"/>
    <circle cx="99.6" cy="306.4" r="27"/>
    <circle cx="58" cy="206" r="27"/>
    <circle cx="99.6" cy="105.6" r="27"/>
  </g>

  <!-- slot glyphs -->
  <g fill="#d9c6f2" stroke="#d9c6f2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- music note -->
    <g transform="translate(200,64)">
      <ellipse cx="-4" cy="8" rx="6.5" ry="5" transform="rotate(-20 -4 8)" stroke="none"/>
      <path d="M2,7 V-12 L11,-7" fill="none" stroke-width="3.5"/>
    </g>
    <!-- exclamation -->
    <g transform="translate(342,206)" stroke="none">
      <rect x="-3.5" y="-13" width="7" height="16" rx="3.5"/>
      <circle cx="0" cy="9" r="4"/>
    </g>
    <!-- smile -->
    <g transform="translate(300.4,306.4)">
      <path d="M-10,0 Q0,13 10,0" fill="none" stroke-width="3.5"/>
      <circle cx="-5.5" cy="-7" r="3" stroke="none"/><circle cx="5.5" cy="-7" r="3" stroke="none"/>
    </g>
    <!-- sleep -->
    <g transform="translate(200,348)" fill="none" stroke-width="3.2">
      <path d="M-11,-4 H-1 L-11,8 H-1"/>
      <path d="M3,-11 H10 L3,-3 H10"/>
    </g>
    <!-- talk -->
    <g transform="translate(99.6,306.4)" stroke="none">
      <circle cx="-9" cy="0" r="3.6"/><circle cx="0" cy="0" r="3.6"/><circle cx="9" cy="0" r="3.6"/>
    </g>
    <!-- sparkle -->
    <path transform="translate(58,206)" d="M0,-13 L3.5,-3.5 L13,0 L3.5,3.5 L0,13 L-3.5,3.5 L-13,0 L-3.5,-3.5 Z" stroke="none"/>
    <!-- tear -->
    <path transform="translate(99.6,105.6)" d="M0,-12 C5,-4 8,0 8,5 A8,8 0 0 1 -8,5 C-8,0 -5,-4 0,-12 Z" stroke="none"/>
  </g>

  <!-- the lit slot the hero is waving at -->
  <circle cx="300.4" cy="105.6" r="30" fill="#ff6fae" opacity="0.5" filter="url(#glow)"/>
  <circle cx="300.4" cy="105.6" r="29" fill="url(#lit)" stroke="#3a2306" stroke-width="6"/>
  <circle cx="300.4" cy="105.6" r="29" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <path transform="translate(300.4,107)" d="M0,11 C-17,-1 -13,-14 -6,-14 C-2.5,-14 0,-11.5 0,-8 C0,-11.5 2.5,-14 6,-14 C13,-14 17,-1 0,11 Z"
        fill="#fff6fa" stroke="#7a1c47" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- the hero, waving -->
  <g stroke-linecap="round">
    <g stroke="#3a2306" stroke-width="24">
      <path d="M224,236 L258,178"/>
    </g>
    <g stroke="url(#gold)" stroke-width="16">
      <path d="M224,236 L258,178"/>
    </g>
  </g>
  <g stroke="#3a2306" stroke-width="4" fill="url(#gold)">
    <circle cx="260" cy="174" r="13"/>
  </g>
  <g transform="translate(200,274) scale(1.5)" stroke="#3a2306" stroke-width="2.6" stroke-linejoin="round" fill="url(#gold)">
    <path d="M-28,0 C-28,-30 -18,-44 0,-44 C18,-44 28,-30 28,0 Z"/>
    <circle cx="0" cy="-62" r="15"/>
  </g>

  <!-- wave motion lines -->
  <g fill="none" stroke="#ff8fc0" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M276,150 Q288,160 286,176"/>
    <path d="M238,152 Q242,140 254,136"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M356,38 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M40,348 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M34,30 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
  </g>
  <g fill="#ff8fc0" filter="url(#glow)">
    <circle cx="356" cy="356" r="3.5"/><circle cx="146" cy="168" r="3"/><circle cx="318" cy="226" r="2.5"/>
  </g>
</svg>
